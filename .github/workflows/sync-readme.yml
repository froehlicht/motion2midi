name: Sync README to Landing Page

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert README to Jekyll page
        run: |
          # Create index.md with Jekyll front matter + README content
          cat > index.md << 'EOL'
          ---
          layout: default
          title: Motion2MIDI - Hand Motion Control for DAWs
          description: Control your DAW with hand movements using your webcam
          ---

          EOL
          
          # Append README content (skip first line if it's a title)
          tail -n +2 README.md >> index.md
          
          # Add download button
          cat >> index.md << 'EOL'

          ---

          <div style="text-align: center; margin: 40px 0;">
            <a href="https://github.com/froehlicht/motion2midi/releases/latest" 
               style="display: inline-block; padding: 15px 30px; background: #0366d6; color: white; 
                      text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 18px;">
              ⬇️ Download Latest Release
            </a>
          </div>

          <!-- Stats -->
          <div style="text-align: center; margin: 30px 0;">
            <img src="https://img.shields.io/github/downloads/froehlicht/motion2midi/total?style=for-the-badge&label=Downloads" alt="Downloads">
            <img src="https://img.shields.io/github/v/tag/froehlicht/motion2midi?style=for-the-badge&label=Version" alt="Version">
            <img src="https://img.shields.io/github/stars/froehlicht/motion2midi?style=for-the-badge" alt="Stars">
          </div>

          <!-- Contact -->
          <div style="background: #f6f8fa; padding: 30px; border-radius: 6px; margin: 40px 0; text-align: center;">
            <h3>📧 Get in Touch</h3>
            <p>
              <strong>Email:</strong> <a href="mailto:contact@motion2midi.com">contact@motion2midi.com</a><br>
              <strong>Report Issues:</strong> <a href="https://github.com/froehlicht/motion2midi/issues">GitHub Issues</a><br>
              <strong>Source:</strong> <a href="https://github.com/froehlicht/motion2midi">GitHub Repository</a>
            </p>
          </div>
          EOL

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.md
          git diff --quiet && git diff --staged --quiet || git commit -m "🔄 Auto-sync: Update landing page from README"
          git push
